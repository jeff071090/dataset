:root{--azul:#2a6fb0;--escuro:#0f3b5c;--fundo:#e9f6f5;--card:#fff;--borda:#cfe3e2;--texto:#1d2b33}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--fundo);color:var(--texto)}
header{background:var(--escuro);color:#fff;padding:14px 20px;font-weight:700;font-size:18px}
main{display:flex;gap:24px;padding:20px;max-width:1400px;margin:0 auto;align-items:flex-start}
.painel{flex:0 0 340px;background:var(--card);border:1px solid var(--borda);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:14px}
.preview{flex:1;display:flex;justify-content:center}
canvas{width:100%;max-width:900px;height:auto;border-radius:8px;box-shadow:0 6px 24px rgba(15,59,92,.18);background:#fff}
label{font-size:13px;font-weight:600;display:block;margin-bottom:5px}
input[type=text],textarea,select{width:100%;padding:10px;border:1px solid var(--borda);border-radius:8px;font-size:16px;font-family:inherit}
textarea{font-size:14px;resize:vertical;min-height:170px}
.btn{display:block;width:100%;padding:12px;border:0;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;background:var(--azul);color:#fff;text-align:center}
.btn.sec{background:#e3eff7;color:var(--escuro)}
.linha{display:flex;gap:8px}
.linha>*{flex:1}
.dica{font-size:12px;color:#587078;margin:4px 0 0}
details{border-top:1px solid var(--borda);padding-top:10px}
summary{cursor:pointer;font-weight:600;font-size:13px}
details>div{display:flex;flex-direction:column;gap:12px;margin-top:12px}
@media (max-width:820px){main{flex-direction:column-reverse;padding:12px}.painel{flex:auto;width:100%}}
</style>
</head>
<body>
<header>🏖️ Editor “Boas Férias”</header>
<main>
  <section class="painel">
    <div>
      <label for="nome">1. Nome</label>
      <input type="text" id="nome" value="Daiane" maxlength="40" autocomplete="off">
    </div>
    <div>
      <label for="genero">2. Tratamento</label>
      <select id="genero">
        <option value="f">Feminino (Querida… tê-la)</option>
        <option value="m">Masculino (Querido… tê-lo)</option>
      </select>
    </div>
    <div>
      <label for="data">3. Data de retorno (dia/mês)</label>
      <input type="text" id="data" value="08/01" maxlength="5" inputmode="numeric" autocomplete="off">
    </div>
    <div class="linha">
      <button class="btn" id="baixarPng">Baixar PNG</button>
      <button class="btn sec" id="baixarJpg">Baixar JPG</button>
    </div>
    <details>
      <summary>Editar o texto da mensagem</summary>
      <div>
        <div>
          <textarea id="texto"></textarea>
          <p class="dica"><b>{nome}</b> e <b>{data}</b> são trocados automaticamente. Linha em branco = novo parágrafo.</p>
        </div>
        <button class="btn sec" id="restaurar">Restaurar texto padrão</button>
      </div>
    </details>
  </section>
  <section class="preview">
    <canvas id="tela" width="1748" height="1240"></canvas>
  </section>
</main>
<script>
(() => {
  // ---- Medidas do modelo (pixels da arte original 1748x1240) ----
  const CX = 1216;              // centro do cartão
  const LARG_MAX = 515;         // largura máxima de cada linha
  const BASE_1 = 662;           // linha de base da 1ª linha do texto
  const TAM = 26, TAM_ASS = 27; // tamanho da fonte do texto e da assinatura no modelo (px)
  const PASSO = 37;             // espaço entre linhas
  const ESP_PARAGRAFO = 38;     // espaço extra entre parágrafos
  const ESP_ASSINATURA = 78;    // da última linha até "Atenciosamente,"
  const LOGO_LARG = 290, LOGO_ESP = 16, LIMITE_INF = 1090;
  const COR_TEXTO = "#403e3a", COR_AZUL = "#6ea8dc";

  const TEXTOS = {
    f: "Querida {nome}, desejamos que as suas férias sejam incríveis e repletas de momentos agradáveis e relaxantes.\n\nLembramos que seu retorno está previsto para o dia {data}, aguardamos ansiosamente para tê-la de volta em nossa equipe.",
    m: "Querido {nome}, desejamos que as suas férias sejam incríveis e repletas de momentos agradáveis e relaxantes.\n\nLembramos que seu retorno está previsto para o dia {data}, aguardamos ansiosamente para tê-lo de volta em nossa equipe."
  };

  const tela = document.getElementById("tela");

  function formatarData(v) {
    const d = v.replace(/\D/g, "").slice(0, 4);

  // quebra o texto em linhas que cabem na largura
  function quebrar(paragrafo, largura) {
    const palavras = paragrafo.split(/\s+/).filter(Boolean), linhas = [];
    let atual = "";
    for (const p of palavras) {
      const teste = atual ? atual + " " + p : p;
      if (ctx.measureText(teste).width > largura && atual) { linhas.push(atual); atual = p; }
      else atual = teste;
    }
    if (atual) linhas.push(atual);
    return linhas;
  }

  function montar(escala) {
    const nome = el("nome").value.trim() || "Nome";
    const texto = el("texto").value.replaceAll("{nome}", nome).replaceAll("{data}", formatarData(el("data").value));
    ctx.font = `300 ${TAM * escala}px "DMSans"`;
    const paragrafos = texto.split(/\n\s*\n/).map(p => p.replace(/\n/g, " ").trim()).filter(Boolean);
    const itens = []; let y = BASE_1;
    paragrafos.forEach((p, i) => {
      if (i > 0) y += ESP_PARAGRAFO * escala;
      quebrar(p, LARG_MAX).forEach((l, j) => { if (i > 0 || j > 0) y += PASSO * escala; itens.push({ l, y }); });
    });
    const yAss = y + ESP_ASSINATURA * escala;
    const logoTopo = yAss + LOGO_ESP;
    const logoAlt = LOGO_LARG * logo.height / logo.width;
    return { itens, yAss, logoTopo, logoAlt, fim: logoTopo + logoAlt };
  }

  function render() {
    if (!fundo.complete || !logo.complete) return;
    ctx.drawImage(fundo, 0, 0, tela.width, tela.height);
    // reduz a fonte se o texto ficar grande demais para o cartão
    let escala = 1, lay = montar(escala);
    while (lay.fim > LIMITE_INF && escala > 0.6) { escala -= 0.02; lay = montar(escala); }

    ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
    ctx.fillStyle = COR_TEXTO;
    ctx.font = `300 ${TAM * escala}px "DMSans"`;
    lay.itens.forEach(it => ctx.fillText(it.l, CX, it.y));

    ctx.fillStyle = COR_AZUL;
    ctx.font = `700 ${TAM_ASS * escala}px "DMSans"`;
    ctx.fillText("Atenciosamente,", CX, lay.yAss);

    ctx.drawImage(logo, CX - LOGO_LARG / 2, lay.logoTopo, LOGO_LARG, lay.logoAlt);
  }

  // ---- Eventos ----
  el("nome").addEventListener("input", render);
  el("data").addEventListener("input", e => { e.target.value = formatarData(e.target.value); render(); });
  el("genero").addEventListener("change", e => {
    if (!textoEditado) el("texto").value = TEXTOS[e.target.value];
    render();
  });
  el("texto").addEventListener("input", () => { textoEditado = true; render(); });
  el("restaurar").addEventListener("click", () => { textoEditado = false; el("texto").value = TEXTOS[el("genero").value]; render(); });

  function baixar(tipo) {
    const nome = (el("nome").value.trim() || "colaborador").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^\w-]+/g, "-");
    const ext = tipo === "image/png" ? "png" : "jpg";
    tela.toBlob(blob => {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `boas-ferias-${nome}.${ext}`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    }, tipo, 0.95);
  }
  el("baixarPng").addEventListener("click", () => baixar("image/png"));
  el("baixarJpg").addEventListener("click", () => baixar("image/jpeg"));

  fundo.onload = render; logo.onload = render;
  Promise.all([document.fonts.load('300 30px "DMSans"'), document.fonts.load('700 30px "DMSans"')]).then(render);
})();
</script>
</body>
</html>
